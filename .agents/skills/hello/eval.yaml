version: "1"

defaults:
  agent: claude
  provider: local
  trials: 2
  timeout: 300
  threshold: 0.8

tasks:
  - name: spanish_greeting_test
    instruction: |
      ¡Hola! Por favor, responde a mi saludo siguiendo tus protocolos de saludo multilingüe. Guarda tu respuesta completa (incluyendo los saludos en varios idiomas y la pregunta de seguimiento) en un archivo llamado saludo.txt.
    workspace: []
    graders:
      - type: deterministic
        run: |
          passed=0
          total=4

          echo "Current directory:"
          pwd
          
          FILE="saludo.txt"
          
          if [ -f "$FILE" ]; then
            passed=$((passed + 1))
            c1_pass=true; c1_msg="File $FILE exists"
            
            # Check for at least 3 lines (3 greetings + 1 follow-up)
            line_count=$(wc -l < "$FILE")
            if [ "$line_count" -ge 3 ]; then
              passed=$((passed + 1))
              c2_pass=true; c2_msg="Response has at least 3 lines"
            else
              c2_pass=false; c2_msg="Response too short ($line_count lines)"
            fi
            
            # Check for absence of language labels (e.g., "Spanish:", "Inglés:")
            if ! grep -q ":" "$FILE"; then
              passed=$((passed + 1))
              c3_pass=true; c3_msg="No language labels (like 'English:') found"
            else
              c3_pass=false; c3_msg="Found potential language labels (colons)"
            fi
            
            # Check for a question mark (follow-up question)
            if grep -q "?" "$FILE"; then
              passed=$((passed + 1))
              c4_pass=true; c4_msg="Follow-up question included"
            else
              c4_pass=false; c4_msg="No follow-up question found"
            fi
          else
            c1_pass=false; c1_msg="File $FILE not found"
            c2_pass=false; c2_msg="N/A"
            c3_pass=false; c3_msg="N/A"
            c4_pass=false; c4_msg="N/A"
          fi

          score=$(awk "BEGIN {printf \"%.2f\", $passed/$total}")
          echo "{\"score\":$score,\"details\":\"$passed/$total checks passed\",\"checks\":[{\"name\":\"file_exists\",\"passed\":$c1_pass,\"message\":\"$c1_msg\"},{\"name\":\"line_count\",\"passed\":$c2_pass,\"message\":\"$c2_msg\"},{\"name\":\"no_labels\",\"passed\":$c3_pass,\"message\":\"$c3_msg\"},{\"name\":\"follow_up\",\"passed\":$c4_pass,\"message\":\"$c4_msg\"}]}"
        weight: 0.6
      - type: llm_rubric
        rubric: |
          1. Did the agent provide greetings in exactly three different languages?
          2. Are the greetings written without language labels (e.g., NO "English: Hello")?
          3. Is there a jovial/colloquial follow-up question at the end (e.g., "¿En qué te ayudo, bro?")?
          4. Is the tone warm and appropriate for a greeting?
        weight: 0.4

  - name: english_informal_greeting_test
    instruction: |
      Hey there! Please respond to my greeting using your multilingual greeting skill. Save the exact text of your response in a file named morning.txt.
    workspace: []
    graders:
      - type: deterministic
        run: |
          passed=0
          total=4
          
          FILE="morning.txt"
          
          if [ -f "$FILE" ]; then
            passed=$((passed + 1))
            c1_pass=true; c1_msg="File $FILE exists"
            
            line_count=$(wc -l < "$FILE")
            if [ "$line_count" -ge 3 ]; then
              passed=$((passed + 1))
              c2_pass=true; c2_msg="Response has at least 3 lines"
            else
              c2_pass=false; c2_msg="Response too short"
            fi
            
            if ! grep -q ":" "$FILE"; then
              passed=$((passed + 1))
              c3_pass=true; c3_msg="No language labels found"
            else
              c3_pass=false; c3_msg="Found colons (possible labels)"
            fi
            
            if grep -q "?" "$FILE"; then
              passed=$((passed + 1))
              c4_pass=true; c4_msg="Follow-up question included"
            else
              c4_pass=false; c4_msg="No follow-up question found"
            fi
          else
            c1_pass=false; c1_msg="File $FILE not found"
            c2_pass=false; c2_msg="N/A"
            c3_pass=false; c3_msg="N/A"
            c4_pass=false; c4_msg="N/A"
          fi

          score=$(awk "BEGIN {printf \"%.2f\", $passed/$total}")
          echo "{\"score\":$score,\"details\":\"$passed/$total checks passed\",\"checks\":[{\"name\":\"file_exists\",\"passed\":$c1_pass,\"message\":\"$c1_msg\"},{\"name\":\"line_count\",\"passed\":$c2_pass,\"message\":\"$c2_msg\"},{\"name\":\"no_labels\",\"passed\":$c3_pass,\"message\":\"$c3_msg\"},{\"name\":\"follow_up\",\"passed\":$c4_pass,\"message\":\"$c4_msg\"}]}"
        weight: 0.6
      - type: llm_rubric
        rubric: |
          1. Did the agent use three distinct languages in the response?
          2. Are there no labels like "French:" or "Spanish:"?
          3. Is the follow-up question informal and jovial (e.g., "how can I help you out?", "en qué andas?")?
          4. Does the response start with an emoji as shown in the skill examples?
        weight: 0.4
